services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voxpm
      POSTGRES_PASSWORD: voxpm
      POSTGRES_DB: voxpm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxpm"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://voxpm:voxpm@postgres:5432/voxpm
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:5173
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: apps/api/src
          target: /app/src

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
